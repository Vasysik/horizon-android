[package]
name = "horizon-document-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[workspace]
[dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = "0.21"
android_logger = "0.15"
log = "0.4"

winit = { path = "../../third_party/winit", features = ["android-native-activity"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
