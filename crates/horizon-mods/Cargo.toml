[package]
name = "horizon-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
description = "Horizon's mod files: content mods, modpacks and the registry index (docs/mods.md)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
log = "0.4"
