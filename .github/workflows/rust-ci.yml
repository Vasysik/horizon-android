name: Rust CI

on:
  pull_request:
    paths: &rust_paths
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [android, 'feat/experimental-svc*']
    paths: *rust_paths
  workflow_dispatch:
    inputs:
      toolchain:
        description: Toolchain to run (blank runs the full stable/beta/MSRV matrix)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Summary
        if: always()
        run: |
          echo '### Rust formatting' >> "$GITHUB_STEP_SUMMARY"
          rustfmt --version >> "$GITHUB_STEP_SUMMARY"
          echo 'Check: `cargo fmt --all -- --check`' >> "$GITHUB_STEP_SUMMARY"

  compiler-matrix:
    name: Clippy and tests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ github.event_name == 'workflow_dispatch' && inputs.toolchain != '' && fromJSON(format('["{0}"]', inputs.toolchain)) || fromJSON('["stable","beta","1.95.0"]') }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libudev-dev libxkbcommon-dev libopus-dev cmake pkg-config
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::all
      - name: Tests
        run: cargo test --workspace
      - name: Summary
        if: always()
        run: |
          echo '### Rust checks (${{ matrix.toolchain }})' >> "$GITHUB_STEP_SUMMARY"
          rustc --version >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands: `cargo clippy --workspace --all-targets -- -D warnings -A clippy::all`, `cargo test --workspace`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-matrix-${{ matrix.toolchain }}-failure
          path: target/debug/*.log
          if-no-files-found: ignore
          retention-days: 3

  android-target-check:
    if: github.event_name == 'workflow_dispatch'
    name: Android target check (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android NDK
        run: |
          sdkmanager --install 'ndk;28.2.13676358'
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android26-clang"
            echo "CMAKE_TOOLCHAIN_FILE_aarch64_linux_android=$NDK/build/cmake/android.toolchain.cmake"
            echo "ANDROID_ABI=arm64-v8a"
            echo "ANDROID_PLATFORM=android-26"
            echo "CMAKE_POLICY_VERSION_MINIMUM=3.5"
            echo "PKG_CONFIG_ALLOW_CROSS=0"
          } >> "$GITHUB_ENV"
      - name: Check Android library
        run: cargo check -p horizon-android --target aarch64-linux-android
      - name: Summary
        if: always()
        run: |
          echo '### Android target check' >> "$GITHUB_STEP_SUMMARY"
          rustc --version >> "$GITHUB_STEP_SUMMARY"
          echo 'Command: `cargo check -p horizon-android --target aarch64-linux-android`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-target-failure
          path: ${{ runner.temp }}/_runner_file_commands/
          if-no-files-found: ignore
          retention-days: 3
