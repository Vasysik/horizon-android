name: Flutter launcher APK

on:
  workflow_dispatch:
  push:
    branches: [flutter-ui]
    paths:
      - 'flutter_app/**'
      - 'crates/horizon-client/src/android/**'
      - 'crates/horizon-client/src/android_main.rs'
      - 'packaging/android/**'
      - 'tools/**'
      - '.github/workflows/flutter-launcher.yml'

permissions:
  contents: read

concurrency:
  group: flutter-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Analyze Flutter app
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos

  smoke:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Build a packaging smoke APK
        run: |
          set -euo pipefail
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/assets
          printf 'not distributable' > flutter_app/android/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          printf 'not distributable' > flutter_app/android/app/src/main/assets/engine-data.zip
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_SDK=$(dirname "$(dirname "$FLUTTER_BIN")")
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_SDK"
          } > flutter_app/android/local.properties
          cd flutter_app
          flutter pub get
          cd android
          gradle wrapper --gradle-version 8.14
          cd ..
          flutter build apk --release --target-platform android-arm64

  apk:
    needs: [analyze, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'

      - name: Install Android toolchain
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          rustup target add aarch64-linux-android

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: flutter-engine-${{ runner.os }}-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            flutter-engine-${{ runner.os }}-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
            android-dev-${{ runner.os }}-arm64-v8a-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-

      - name: Check public source boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare private engine inputs
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Build engine APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Stage engine into the Flutter app
        run: |
          set -euo pipefail
          apk=.local/android/apk/arm64-v8a/horizon-android-public.apk
          mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p flutter_app/android/app/src/main/assets
          unzip -p "$apk" lib/arm64-v8a/libhorizon_android.so \
            > flutter_app/android/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          unzip -p "$apk" assets/engine-data.zip \
            > flutter_app/android/app/src/main/assets/engine-data.zip
          unzip -p "$apk" assets/LICENSE.txt \
            > flutter_app/android/app/src/main/assets/LICENSE.txt
          unzip -p "$apk" assets/THIRD_PARTY_NOTICES.md \
            > flutter_app/android/app/src/main/assets/THIRD_PARTY_NOTICES.md
          test -s flutter_app/android/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          test -s flutter_app/android/app/src/main/assets/engine-data.zip

      - name: Configure Flutter Android build
        run: |
          set -euo pipefail
          FLUTTER_BIN=$(command -v flutter)
          FLUTTER_SDK=$(dirname "$(dirname "$FLUTTER_BIN")")
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_SDK"
          } > flutter_app/android/local.properties
          cd flutter_app
          flutter pub get
          cd android
          gradle wrapper --gradle-version 8.14

      - name: Build Flutter APK
        run: |
          cd flutter_app
          flutter build apk --release --target-platform android-arm64 \
            --build-name 1.0.0 --build-number "${{ github.run_number }}"

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/Horizon-UI.${{ github.run_number }}.apk"
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          sha256sum "dist/Horizon-UI.${{ github.run_number }}.apk" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: horizon-ui-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
