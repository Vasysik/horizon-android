# On-demand public release APKs. Push an apk-* tag (or dispatch manually) and
# the armeabi-v7a APK is built from that one fixed commit, audited by
# tools/check_android_release.py and attached to a GitHub release. (Add more
# matrix entries, e.g. arm64-v8a, to publish additional ABIs.) Mojang inputs
# download at build time and never enter Git. The dev signing key is generated
# once per run (or restored from the ANDROID_DEV_KEYSTORE_B64 secret) and kept
# in an artifact so later runs can preserve the signing identity.
name: Android release APKs
on:
  push:
    tags: ['apk-*']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: "off"
jobs:
  signing-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reuse the key generated by the first successful release run so later
      # builds update over an existing install; the secret still wins, and a
      # fresh key is generated when neither is available.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: signing-key
          path: previous
          run-id: 41231877664
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate or restore the dev signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEV_KEYSTORE_B64 }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > out/debug.keystore
          elif [ -f previous/debug.keystore ]; then
            cp previous/debug.keystore out/debug.keystore
            echo "Reusing the established dev signing key."
          else
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore out/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -validity 3650 -dname 'CN=Oxide Android Development'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signing-key
          path: out/debug.keystore
          retention-days: 90
  apk:
    needs: signing-key
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Android toolchain
        run: |
          # Newer runner images ship no sdkmanager; fall back to Google's
          # command-line tools and a writable SDK root when that happens.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config
          image_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdk="$image_sdk"; manager=$(command -v sdkmanager)
          elif [ -x "$image_sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdk="$image_sdk"; manager="$image_sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            sdk="$RUNNER_TEMP/android-sdk"
            mkdir -p "$sdk/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              || curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            yes | "$manager" --sdk_root="$sdk" --licenses > /dev/null
          fi
          "$manager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          df -h /
      - name: Install the Rust Android target
        run: rustup target add "${{ matrix.target }}"
      - name: Pin Gradle 8.14
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_BIN=$RUNNER_TEMP/gradle-8.14/bin/gradle" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signing-key
          path: .local/android
      - name: Prepare engine tables from Mojang's pinned inputs
        run: |
          set -euo pipefail
          python3 tools/android_prepare.py --java-home "$JAVA_HOME_17_X64" 2>&1 | tee "$RUNNER_TEMP/prepare.log"
          version=$(python3 -c "import json; print(json.load(open('research-lock.json'))['minecraft']['version'])")
          tables=".local/horizon-client/$version"
          test -f "$tables/horizon-resources.json"
          test -f "$tables/worldgen/blocks/structure-blocks.json"
          echo "Prepared tables: $(find "$tables" -type f | wc -l) files, $(du -sh "$tables" | cut -f1)"
      - name: Reclaim runner disk before the release build
        run: |
          rm -rf target/debug .local/android/minecraft .local/android/serve
          df -h / "$RUNNER_TEMP"
      - name: Build the public release APK (${{ matrix.abi }})
        run: |
          set -euo pipefail
          python3 tools/android_build.py --abi "${{ matrix.abi }}" --public \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$GRADLE_BIN" \
            2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Surface log tails as annotations
        if: failure()
        run: |
          # Annotation messages truncate at 4096 chars, so the last 12 KB of
          # the build log goes out in three ordered chunks; the final chunk
          # always contains the actual error.
          encode() { sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }' | sed 's/%0A$//'; }
          log="$RUNNER_TEMP/build.log"
          if [ -f "$log" ]; then
            # Every rustc error header and source location first: one compact
            # annotation that survives any log size.
            errs=$(grep -E "^error(\[|:)|^ +--> |aborting due to|could not compile|error: failed" "$log" | head -c 3400 | encode)
            if [ -n "$errs" ]; then
              echo "::error title=build errors (grep)::${errs}"
            fi
            tail -c 24000 "$log" > "$RUNNER_TEMP/tail.log"
            total=$(wc -c < "$RUNNER_TEMP/tail.log")
            part=1
            start=0
            while [ "$start" -lt "$total" ]; do
              body=$(dd if="$RUNNER_TEMP/tail.log" bs=1 skip="$start" count=3600 2>/dev/null | encode)
              echo "::error title=build log tail part ${part} (${start}-${total})::${body}"
              part=$((part + 1))
              start=$((start + 3600))
            done
          fi
          if [ -f "$RUNNER_TEMP/prepare.log" ]; then
            echo "::error title=prepare log tail::$(tail -c 3600 "$RUNNER_TEMP/prepare.log" | encode)"
          fi
          echo "::error title=disk::$(df -h / | awk 'NR == 2 { print "total " $2 ", available " $4 }')"
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stage the APK under its release name
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" packaging/android/build.gradle | head -1)
          cp ".local/android/apk/${{ matrix.abi }}/horizon-android-public.apk" \
            "Oxide-Android-${version}-${{ matrix.abi }}.apk"
          ls -la Oxide-Android-*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-${{ matrix.abi }}
          path: Oxide-Android-*.apk
          retention-days: 90
  release:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: apk-*
          merge-multiple: true
          path: out
      - name: Publish the release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" packaging/android/build.gradle | head -1)
          commit=$(git rev-parse --short=12 HEAD)
          cat > notes.md <<EOF
          > 🤖 Published by kushaladhikari982648-lgtm's AI agent (Arena.ai Agent Mode), not by kushaladhikari982648-lgtm personally.

          Public release APK built from commit \`${commit}\`.

          - **Oxide-Android-${version}-armeabi-v7a.apk** - 32-bit ARMv7 devices
            (installs on ARMv8/64-bit phones too, in 32-bit mode)

          Includes the Minecraft-styled dark stone launcher UI (PR #1). Release-optimized
          (opt-level 3, ThinLTO), non-debuggable, payload-audited; original game resources
          download from Mojang on first run.

          Signed with a generated development key (kept in this run's \`signing-key\`
          artifact for 90 days). Future updates install over an existing install only when
          rebuilt with the same key: keep that keystore, or set the
          \`ANDROID_DEV_KEYSTORE_B64\` repository secret (base64 of a \`debug.keystore\`
          with alias \`androiddebugkey\`, store/key password \`android\`) before the next run.
          EOF
          gh release create "$GITHUB_REF_NAME" out/Oxide-Android-*.apk \
            --title "Oxide Android ${version} (${GITHUB_REF_NAME})" \
            --notes-file notes.md
