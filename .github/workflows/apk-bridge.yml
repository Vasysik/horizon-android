# One-off transport, not part of the release flow: moves an already-built
# release APK from Actions artifact storage onto a short-lived scratch branch
# so it can be retrieved over the git protocol directly, then deleted. The
# scratch branch is never merged and never scanned by the public-tree checks;
# this workflow file itself is removed once the transfer is done.
name: APK bridge
on:
  push:
    tags: ['apk-bridge-*']
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apk-armeabi-v7a
          path: incoming
          run-id: 41339035948
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the APK to the scratch branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/bridge.log") 2>&1
          set -x
          ls -la incoming/
          cp incoming/Oxide-Android-*.apk Oxide-Android-0.7.6-armeabi-v7a.apk
          sha256sum Oxide-Android-0.7.6-armeabi-v7a.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-drop
          git rm -rf --cached . > /dev/null
          # -f: the repo's .gitignore excludes *.apk to keep binaries out of
          # real branches; this scratch branch is deleted right after retrieval.
          git add -f Oxide-Android-0.7.6-armeabi-v7a.apk
          git commit -m "Scratch APK transfer (deleted right after retrieval; never merged)"
          set +x
          git push -f "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-drop:apk-drop
          set -x
          echo BRIDGE_PUSH_DONE
      - name: Report failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/bridge.log"
          if [ -f "$log" ]; then
            body=$(tail -c 3600 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }' | sed 's/%0A$//')
            echo "::error title=bridge log tail::${body}"
          else
            echo "::error title=bridge::no log file produced"
          fi
