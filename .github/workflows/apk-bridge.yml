# Temporary APK transfer through Git objects. No APK is pushed to a branch.
name: Temporary APK bridge
on:
  push:
    tags: ['bridge-fetch-*']
permissions:
  actions: read
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apk-armeabi-v7a
          path: incoming
          run-id: 42284409553
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apk-arm64-v8a
          path: incoming64
          run-id: 42284409553
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish APK objects under a temporary tag only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp incoming/Oxide-Android-0.7.6-armeabi-v7a.apk Oxide-Android-0.7.6-armeabi-v7a.apk
          cp incoming64/Oxide-Android-0.7.6-arm64-v8a.apk Oxide-Android-0.7.6-arm64-v8a.apk
          sha256sum Oxide-Android-0.7.6-*.apk
          v7=$(git hash-object -w Oxide-Android-0.7.6-armeabi-v7a.apk)
          v8=$(git hash-object -w Oxide-Android-0.7.6-arm64-v8a.apk)
          tree=$(printf '100644 blob %s\t%s\n100644 blob %s\t%s\n' \
            "$v7" Oxide-Android-0.7.6-armeabi-v7a.apk \
            "$v8" Oxide-Android-0.7.6-arm64-v8a.apk | LC_ALL=C sort | git mktree)
          commit=$(printf '%s\n' 'Temporary APK transfer; contains assets only' | \
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$tree")
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$commit:refs/tags/bridge-drop-42284409553"
