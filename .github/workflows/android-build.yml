name: Android build

on:
  workflow_dispatch:
  push:
    branches: [android]
  pull_request:
    branches: [android]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Rust toolchain
        run: |
          rustup show                      # memasang toolchain dari rust-toolchain.toml
          rustup target add aarch64-linux-android

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check public tree
        run: python3 tools/check_public_tree.py

      - name: Run release audit tests
        run: python -m unittest discover -s tests -p test_android_release_audit.py

      - name: Build APK (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: python tools/android_build.py --abi arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p dist
          find . -path ./target -prune -o -name "*.apk" -print -exec cp {} dist/ \;
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14